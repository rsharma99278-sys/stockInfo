spring.application.name=stockinfo-backend
spring.profiles.active=dev

server.port=${PORT:8080}



spring.datasource.url=jdbc:mysql://localhost:3306/stockinfo?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rohit123

spring.jpa.hibernate.ddl-auto=update
