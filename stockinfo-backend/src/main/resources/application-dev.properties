# ============================================
# Development profile overrides
# ============================================

# Show detailed SQL binding values in logs (dev only)
logging.level.org.hibernate.type.descriptor.sql=TRACE

# Recreate schema on every restart? Keep 'update' for now during development
spring.jpa.hibernate.ddl-auto=update

# Detailed error responses while developing (disable in prod)
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
app.cors.allowed-origins=origins=http://127.0.0.1:5500,http://localhost:5500,http://localhost:3000,http://localhost:63342
# Finnhub live market data (free tier - real-time US tickers)
finnhub.api.key=${FINNHUB_API_KEY:}
finnhub.api.base-url=https://finnhub.io/api/v1
