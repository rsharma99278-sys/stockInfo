<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports | StockInfo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbarContainer"></div>

<div class="container-fluid main-content">
    <h3 class="page-title">Reports &amp; Insights</h3>
    <p class="page-subtitle">Portfolio breakdown and rule-based investment suggestions</p>

    <div id="loadingWrap" class="spinner-wrap"><div class="spinner-border text-primary"></div></div>

    <div id="reportsContent" class="d-none">

        <div class="row g-3 mb-4">
            <div class="col-lg-5">
                <div class="card p-3 h-100">
                    <h6 class="fw-bold mb-3"><i class="bi bi-pie-chart me-1"></i>Portfolio Allocation by Sector</h6>
                    <div style="position:relative; height:260px;"><canvas id="allocationChart"></canvas></div>
                    <p id="noHoldingsMsg" class="text-muted text-center mt-3 d-none">No holdings yet - buy some stocks to see your allocation here.</p>
                </div>
            </div>
            <div class="col-lg-7">
                <div class="card p-3 h-100">
                    <h6 class="fw-bold mb-3"><i class="bi bi-bar-chart me-1"></i>Invested vs Current Value (per holding)</h6>
                    <div style="position:relative; height:260px;"><canvas id="valueChart"></canvas></div>
                </div>
            </div>
        </div>

        <div class="card p-3">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                <h6 class="fw-bold mb-0"><i class="bi bi-lightbulb me-1"></i>Investment Suggestions</h6>
                <div class="btn-group">
                    <button class="btn btn-sm btn-outline-secondary active" data-filter="ALL">All</button>
                    <button class="btn btn-sm btn-outline-success" data-filter="BUY">Buy</button>
                    <button class="btn btn-sm btn-outline-warning" data-filter="HOLD">Hold</button>
                    <button class="btn btn-sm btn-outline-danger" data-filter="SELL">Sell</button>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead><tr><th>Stock</th><th>Suggestion</th><th>Reason</th></tr></thead>
                    <tbody id="suggestionsBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/api.js"></script>
<script src="js/reports.js"></script>
</body>
</html>
