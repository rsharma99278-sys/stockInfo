<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | StockInfo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="text-center mb-4">
      <i class="bi bi-graph-up-arrow brand-icon"></i>
      <h2 class="mt-2 mb-0">Create Account</h2>
      <p class="text-muted mb-0">Start managing your virtual portfolio</p>
    </div>

    <div id="regError" class="alert alert-danger d-none" role="alert"></div>
    <div id="regSuccess" class="alert alert-success d-none" role="alert"></div>

    <form id="registerForm">
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control" id="fullName" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" id="username" minlength="4" required>
        <div class="form-text">At least 4 characters.</div>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Mobile Number <span class="text-muted">(optional)</span></label>
        <input type="tel" class="form-control" id="phoneNumber" pattern="[6-9][0-9]{9}" maxlength="10" placeholder="10-digit mobile number">
        <div class="form-text">Optional. Must start with 6-9 if provided.</div>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <div class="input-group">
          <input type="password" class="form-control" id="password" minlength="6" required>
          <button class="btn btn-outline-secondary" type="button" id="togglePassword" tabindex="-1">
            <i class="bi bi-eye" id="togglePasswordIcon"></i>
          </button>
        </div>
        <div class="form-text">At least 6 characters.</div>
      </div>
      <button type="submit" class="btn btn-primary w-100" id="registerBtn">
        <span id="registerBtnText">Create Account</span>
        <span id="registerSpinner" class="spinner-border spinner-border-sm d-none ms-1"></span>
      </button>
    </form>

    <p class="text-center mt-4 mb-0 text-muted">
      Already have an account? <a href="index.html">Login here</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
  if (Auth.isLoggedIn()) {
    window.location.href = "dashboard.html";
  }

  document.getElementById("togglePassword").addEventListener("click", () => {
    const pwd = document.getElementById("password");
    const icon = document.getElementById("togglePasswordIcon");
    const isHidden = pwd.type === "password";
    pwd.type = isHidden ? "text" : "password";
    icon.className = isHidden ? "bi bi-eye-slash" : "bi bi-eye";
  });

  document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const errorBox = document.getElementById("regError");
    const successBox = document.getElementById("regSuccess");
    const btn = document.getElementById("registerBtn");
    const btnText = document.getElementById("registerBtnText");
    const spinner = document.getElementById("registerSpinner");

    errorBox.classList.add("d-none");
    successBox.classList.add("d-none");
    btn.disabled = true;
    btnText.textContent = "Creating account...";
    spinner.classList.remove("d-none");

    try {
      await Auth.register({
        fullName: document.getElementById("fullName").value.trim(),
        username: document.getElementById("username").value.trim(),
        email: document.getElementById("email").value.trim(),
        phoneNumber: document.getElementById("phoneNumber").value.trim(),
        password: document.getElementById("password").value
      });

      successBox.textContent = "Account created! Redirecting to login...";
      successBox.classList.remove("d-none");
      setTimeout(() => window.location.href = "index.html", 1200);
    } catch (err) {
      errorBox.textContent = err.message || "Registration failed. Please try again.";
      errorBox.classList.remove("d-none");
      btn.disabled = false;
      btnText.textContent = "Create Account";
      spinner.classList.add("d-none");
    }
  });
</script>
</body>
</html>
