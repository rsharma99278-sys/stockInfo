<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | StockInfo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-bg-bars" id="authBgBars"></div>

  <button class="theme-toggle-btn theme-toggle-floating" onclick="Theme.toggle()" title="Toggle dark/light mode">
    <i class="bi bi-moon-stars theme-toggle-icon"></i>
  </button>

  <div class="auth-card">
    <div class="text-center mb-4">
      <i class="bi bi-graph-up-arrow brand-icon"></i>
      <h2 class="mt-2 mb-0">Stock<span style="color:var(--primary)">Info</span></h2>
      <p class="text-muted mb-0">Log in to your account</p>
    </div>

    <div id="loginError" class="alert alert-danger d-none" role="alert"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" id="username" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <div class="input-group">
          <input type="password" class="form-control" id="password" required>
          <button class="btn btn-outline-secondary" type="button" id="togglePassword" tabindex="-1">
            <i class="bi bi-eye" id="togglePasswordIcon"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100" id="loginBtn">
        <span id="loginBtnText">Login</span>
        <span id="loginSpinner" class="spinner-border spinner-border-sm d-none ms-1"></span>
      </button>
    </form>

    <p class="text-center mt-4 mb-0 text-muted">
      Don't have an account? <a href="register.html">Register here</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
  if (Auth.isLoggedIn()) {
    window.location.href = "dashboard.html";
  }
  Theme.updateIcons();

  (function renderBars() {
    const container = document.getElementById("authBgBars");
    const count = 18;
    for (let i = 0; i < count; i++) {
      const bar = document.createElement("span");
      const left = Math.random() * 100;
      const height = 40 + Math.random() * 140;
      const delay = Math.random() * 8;
      const duration = 6 + Math.random() * 6;
      bar.style.left = `${left}%`;
      bar.style.height = `${height}px`;
      bar.style.animationDelay = `${delay}s`;
      bar.style.animationDuration = `${duration}s`;
      container.appendChild(bar);
    }
  })();

  document.getElementById("togglePassword").addEventListener("click", () => {
    const pwd = document.getElementById("password");
    const icon = document.getElementById("togglePasswordIcon");
    const isHidden = pwd.type === "password";
    pwd.type = isHidden ? "text" : "password";
    icon.className = isHidden ? "bi bi-eye-slash" : "bi bi-eye";
  });

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const errorBox = document.getElementById("loginError");
    const btn = document.getElementById("loginBtn");
    const btnText = document.getElementById("loginBtnText");
    const spinner = document.getElementById("loginSpinner");

    errorBox.classList.add("d-none");
    btn.disabled = true;
    btnText.textContent = "Logging in...";
    spinner.classList.remove("d-none");

    try {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      await Auth.login(username, password);
      window.location.href = "dashboard.html";
    } catch (err) {
      errorBox.textContent = err.message || "Login failed. Please check your credentials.";
      errorBox.classList.remove("d-none");
      btn.disabled = false;
      btnText.textContent = "Login";
      spinner.classList.add("d-none");
    }
  });
</script>
</body>
</html>
