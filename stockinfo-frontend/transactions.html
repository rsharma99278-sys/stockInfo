<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transactions | StockInfo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbarContainer"></div>

<div class="container-fluid main-content">
  <h3 class="page-title">Transaction History</h3>
  <p class="page-subtitle">All your buy/sell activity</p>

  <div id="loadingWrap" class="spinner-wrap"><div class="spinner-border text-primary"></div></div>

  <div class="table-responsive d-none" id="tableWrap">
    <table class="table table-hover align-middle bg-white">
      <thead>
        <tr><th>Date</th><th>Stock</th><th>Type</th><th>Qty</th><th>Price/Unit</th><th>Total</th></tr>
      </thead>
      <tbody id="txnBody"></tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
  Auth.requireLogin();
  renderNavbar("transactions");

  async function loadTransactions() {
    try {
      const txns = await Api.get("/transactions");
      const body = document.getElementById("txnBody");
      if (!txns || txns.length === 0) {
        body.innerHTML = `<tr><td colspan="6" class="text-center text-muted">No transactions yet</td></tr>`;
      } else {
        body.innerHTML = txns.map(t => `
          <tr>
            <td>${new Date(t.transactionDate).toLocaleString()}</td>
            <td><span class="stock-symbol">${t.symbol}</span><br><small class="text-muted">${t.companyName}</small></td>
            <td><span class="badge ${t.type === 'BUY' ? 'bg-success' : 'bg-danger'}">${t.type}</span></td>
            <td>${t.quantity}</td>
            <td>${formatCurrency(t.pricePerUnit)}</td>
            <td>${formatCurrency(t.totalAmount)}</td>
          </tr>
        `).join("");
      }
    } catch (err) {
      showToast(err.message, true);
    } finally {
      document.getElementById("loadingWrap").classList.add("d-none");
      document.getElementById("tableWrap").classList.remove("d-none");
    }
  }

  loadTransactions();
</script>
</body>
</html>
