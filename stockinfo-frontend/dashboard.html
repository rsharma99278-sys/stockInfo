<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | StockInfo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbarContainer"></div>

<div class="container-fluid main-content">
    <h3 class="page-title">Dashboard</h3>
    <p class="page-subtitle">Your portfolio at a glance</p>

    <div id="loadingWrap" class="spinner-wrap"><div class="spinner-border text-primary"></div></div>

    <div id="dashboardContent" class="d-none">

        <div class="row g-3 mb-4">
            <div class="col-md-3 col-6">
                <div class="stat-card dark">
                    <div class="stat-label">Wallet Balance</div>
                    <div class="stat-value" id="walletBalance">₹0.00</div>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="stat-card">
                    <div class="stat-label">Portfolio Value</div>
                    <div class="stat-value" id="portfolioValue">₹0.00</div>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="stat-card" id="plCard">
                    <div class="stat-label">Total Profit/Loss</div>
                    <div class="stat-value" id="totalPL">₹0.00</div>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="stat-card dark">
                    <div class="stat-label">Holdings / Watchlist</div>
                    <div class="stat-value"><span id="holdingsCount">0</span> / <span id="watchlistCount">0</span></div>
                </div>
            </div>
        </div>

        <div class="row g-3">
            <div class="col-lg-7">
                <div class="card p-3 h-100">
                    <h6 class="fw-bold mb-3"><i class="bi bi-briefcase me-1"></i>Top Holdings</h6>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                            <tr><th>Stock</th><th>Qty</th><th>Avg Price</th><th>Current</th><th>P&L</th></tr>
                            </thead>
                            <tbody id="topHoldingsBody">
                            <tr><td colspan="5" class="text-center text-muted">No holdings yet</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <a href="portfolio.html" class="btn btn-sm btn-outline-primary mt-2 align-self-start">View Full Portfolio</a>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="card p-3 h-100">
                    <h6 class="fw-bold mb-3"><i class="bi bi-clock-history me-1"></i>Recent Transactions</h6>
                    <ul class="list-group list-group-flush" id="recentTxnList">
                        <li class="list-group-item text-center text-muted">No transactions yet</li>
                    </ul>
                    <a href="transactions.html" class="btn btn-sm btn-outline-primary mt-2 align-self-start">View All</a>
                </div>
            </div>
        </div>

        <div class="text-center mt-4">
            <a href="stocks.html" class="btn btn-primary"><i class="bi bi-graph-up me-1"></i>Explore Market &amp; Buy Stocks</a>
        </div>
    </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="appToast" class="toast text-bg-success" role="alert">
        <div class="d-flex">
            <div class="toast-body"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
