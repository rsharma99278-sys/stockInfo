<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | StockInfo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbarContainer"></div>

<div class="container-fluid main-content">
    <h3 class="page-title">My Portfolio</h3>
    <p class="page-subtitle">All your current holdings</p>

    <div id="loadingWrap" class="spinner-wrap"><div class="spinner-border text-primary"></div></div>

    <div id="portfolioContent" class="d-none">

        <div class="row g-3 mb-4">
            <div class="col-md-4 col-6">
                <div class="stat-card dark">
                    <div class="stat-label">Total Invested</div>
                    <div class="stat-value" id="totalInvested">₹0.00</div>
                </div>
            </div>
            <div class="col-md-4 col-6">
                <div class="stat-card">
                    <div class="stat-label">Current Value</div>
                    <div class="stat-value" id="currentValue">₹0.00</div>
                </div>
            </div>
            <div class="col-md-4 col-12">
                <div class="stat-card" id="plCard">
                    <div class="stat-label">Total P&L</div>
                    <div class="stat-value" id="totalPL">₹0.00</div>
                </div>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Stock</th><th>Qty</th><th>Avg Price</th><th>Current Price</th>
                    <th>Invested</th><th>Current Value</th><th>P&L</th><th class="text-center">Action</th>
                </tr>
                </thead>
                <tbody id="portfolioBody">
                <tr><td colspan="8" class="text-center text-muted">No holdings yet</td></tr>
                </tbody>
            </table>
        </div>

        <div class="text-center mt-3">
            <a href="stocks.html" class="btn btn-primary"><i class="bi bi-graph-up me-1"></i>Explore Market to Buy More</a>
        </div>
    </div>
</div>

<div class="modal fade" id="sellModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Sell <span id="sellSymbol"></span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="mb-1">Current Price: <strong id="sellPrice"></strong></p>
                <p class="mb-1 text-muted">You own: <span id="sellOwned"></span> shares</p>
                <div class="mb-3">
                    <label class="form-label">Quantity to Sell</label>
                    <input type="number" id="sellQty" class="form-control" min="1" value="1">
                </div>
                <p class="mb-0">Estimated Proceeds: <strong id="sellTotal"></strong></p>
                <div id="sellError" class="alert alert-danger mt-2 d-none"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-danger" id="confirmSellBtn">Confirm Sell</button>
            </div>
        </div>
    </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="appToast" class="toast text-bg-success" role="alert">
        <div class="d-flex">
            <div class="toast-body"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/portfolio.js"></script>
</body>
</html>
