<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watchlist | StockInfo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbarContainer"></div>

<div class="container-fluid main-content">
    <h3 class="page-title">Watchlist</h3>
    <p class="page-subtitle">Stocks you're keeping an eye on <span class="live-dot"></span></p>

    <div id="loadingWrap" class="spinner-wrap"><div class="spinner-border text-primary"></div></div>

    <div id="watchlistContent" class="d-none">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr><th>Stock</th><th class="text-end">Price</th><th class="text-end">Change</th><th class="text-center">Action</th></tr>
                </thead>
                <tbody id="watchlistBody"></tbody>
            </table>
        </div>
        <div class="text-center mt-3">
            <a href="stocks.html" class="btn btn-primary"><i class="bi bi-graph-up me-1"></i>Browse Market to Add More</a>
        </div>
    </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="appToast" class="toast text-bg-success" role="alert">
        <div class="d-flex">
            <div class="toast-body"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/watchlist.js"></script>
</body>
</html>
