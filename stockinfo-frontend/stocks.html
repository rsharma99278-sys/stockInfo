<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market | StockInfo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbarContainer"></div>

<div class="container-fluid main-content">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <div>
            <h3 class="page-title mb-0">Market</h3>
            <p class="page-subtitle mb-0">Live prices, auto-refreshing every 10s <span class="live-dot"></span></p>
        </div>
        <div class="d-flex gap-2 flex-wrap">
            <input type="text" id="searchInput" class="form-control" placeholder="Search symbol or company..." style="width:220px">
            <select id="sectorFilter" class="form-select" style="width:170px">
                <option value="">All Sectors</option>
            </select>
            <div class="btn-group">
                <button class="btn btn-outline-success btn-sm" id="gainersBtn"><i class="bi bi-arrow-up-short"></i> Top Gainers</button>
                <button class="btn btn-outline-danger btn-sm" id="losersBtn"><i class="bi bi-arrow-down-short"></i> Top Losers</button>
                <button class="btn btn-outline-secondary btn-sm" id="resetBtn">Reset</button>
            </div>
        </div>
    </div>

    <div id="loadingWrap" class="spinner-wrap"><div class="spinner-border text-primary"></div></div>

    <div id="stocksContent" class="d-none">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Stock</th><th>Sector</th><th class="text-end">Price</th>
                    <th class="text-end">Change</th><th class="text-center">Watch</th><th class="text-center">Action</th>
                </tr>
                </thead>
                <tbody id="stocksBody"></tbody>
            </table>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-3">
            <span class="text-muted small" id="pageInfo"></span>
        </div>
        <div id="scrollSentinel" class="text-center py-3">
            <div class="spinner-border spinner-border-sm text-primary d-none" id="loadMoreSpinner"></div>
            <span class="text-muted small d-none" id="endOfListMsg">You've reached the end of the list.</span>
        </div>
    </div>
</div>

<!-- Buy Modal -->
<div class="modal fade" id="buyModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Buy <span id="buySymbol"></span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="mb-1">Current Price: <strong id="buyPrice"></strong></p>
                <div class="mb-3">
                    <label class="form-label">Quantity</label>
                    <input type="number" id="buyQty" class="form-control" min="1" value="1">
                </div>
                <p class="mb-0">Estimated Total: <strong id="buyTotal"></strong></p>
                <div id="buyError" class="alert alert-danger mt-2 d-none"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-success" id="confirmBuyBtn">Confirm Buy</button>
            </div>
        </div>
    </div>
</div>

<!-- Stock Detail Modal (live-building price chart) -->
<div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="detailSymbol"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row g-2 mb-3 text-center">
                    <div class="col"><div class="text-muted small">Sector</div><div id="detailSector" class="fw-semibold"></div></div>
                    <div class="col"><div class="text-muted small">Price</div><div id="detailPrice" class="fw-semibold"></div></div>
                    <div class="col"><div class="text-muted small">Change</div><div id="detailChange" class="fw-semibold"></div></div>
                    <div class="col"><div class="text-muted small">Day High</div><div id="detailHigh" class="fw-semibold"></div></div>
                    <div class="col"><div class="text-muted small">Day Low</div><div id="detailLow" class="fw-semibold"></div></div>
                    <div class="col"><div class="text-muted small">Volume</div><div id="detailVolume" class="fw-semibold"></div></div>
                </div>
                <div style="position:relative; height:260px;">
                    <canvas id="detailChartCanvas"></canvas>
                </div>
                <p class="text-muted small text-center mt-2 mb-0">Live tick updates every 10s while this window is open.</p>
            </div>
        </div>
    </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="appToast" class="toast text-bg-success" role="alert">
        <div class="d-flex">
            <div class="toast-body"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/api.js"></script>
<script src="js/stocks.js"></script>
</body>
</html>
